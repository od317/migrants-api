# Temporary HTTP proxy for api.subl.cloud until TLS is issued.
# The variable + Docker DNS resolver lets Nginx start even if the API
# container is briefly restarting.
#
# Add this to /root/khayt-backend/infra/nginx/nginx.conf and reload
# khayt-nginx-prod. Keep HTTPS off until a certificate exists.

server {
    listen 80;
    server_name api.subl.cloud;

    client_max_body_size 55m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $migrants_upstream migrants-api:3000;
        proxy_pass http://$migrants_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
