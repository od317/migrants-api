# Add this server to /root/khayt-backend/infra/nginx/nginx.conf
# and redeploy khayt-nginx-prod. Copy the ssl_certificate lines from an
# existing site in that file once a certificate exists for api.subl.cloud.
#
# The API container joins the Nginx Docker network and is reached by name.
# Port 3002 on the host is only for SSH checks; public traffic stays on 443.

server {
    listen 80;
    server_name api.subl.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.subl.cloud;

    client_max_body_size 55m;

    # ssl_certificate     /etc/letsencrypt/live/api.subl.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.subl.cloud/privkey.pem;

    location / {
        proxy_pass http://migrants-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
